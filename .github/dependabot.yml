version: 2
updates:
  - package-ecosystem: "npm"
    directory: "."
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    ignore:
      # typescript-eslint (via eslint-plugin-jsdoc) supports typescript <6.1.0.
      # Remove once it supports newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
    groups:
      gha:
        patterns:
          - "*"
