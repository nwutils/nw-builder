name: Build NW.js

# Compiles NW.js from source with the patches of every issue merged into
# packages/build-tools/issues, for each platform below, publishes the packages
# as the "build-tools" release (replacing the previous one, marked latest),
# then runs every issue's test against it.
#
# cd.yml calls it when a @nwutils/build-tools release is created, i.e. when
# its release-please pull request is merged. Each platform builds as a chain of
# stages (build-nwjs-platform.yml), so a build can take days.

on:
  workflow_call:
    inputs:
      version:
        description: NW.js version, e.g. 0.120.0, or latest
        type: string
        default: latest
      flavor:
        description: Build flavor (issue tests need the SDK's chromedriver)
        type: string
        default: sdk

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'nwutils'
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve "latest" to a version
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$VERSION" = "latest" ]; then
            VERSION="$(curl -fsSL https://nwjs.io/versions.json | jq -r .latest)"
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    strategy:
      # One platform failing shouldn't stop the others' builds.
      fail-fast: false
      matrix:
        # Add osx-arm64, win-x64, ... once build-tools supports them.
        platform: [linux-x64]
    uses: ./.github/workflows/build-nwjs-platform.yml
    with:
      version: ${{ needs.version.outputs.version }}
      flavor: ${{ inputs.flavor }}
      platform: ${{ matrix.platform }}

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: build-tools
      VERSION: ${{ needs.version.outputs.version }}
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: nwjs-v${{ env.VERSION }}-*-${{ env.FLAVOR }}
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          {
            echo "NW.js v$VERSION ($FLAVOR) built from source by @nwutils/build-tools at $GITHUB_SHA."
            echo
            echo "Patches applied:"
            patches="$(cd packages/build-tools/issues && find . -path './_*' -prune -o -name '*.patch' -print | sort | sed 's|^\./|- |')"
            echo "${patches:-- none}"
          } > notes.md
          cat notes.md

      - name: Replace the release
        # One release at a time: delete the previous one and its tag, then
        # publish this build as the latest release.
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "NW.js v$VERSION ($FLAVOR) — build-tools" \
            --notes-file notes.md \
            --latest

  test:
    name: Test issues
    needs: release
    uses: ./.github/workflows/test-nwjs.yml
