name: Test NW.js issue

# Runs the issue tests (packages/build-tools/issues/<issue>/*.test.js) against
# the NW.js SDK in the latest "build-tools" release: every issue's, or one
# issue's. Called by build-nwjs.yml after it publishes a build, or run on its
# own.

on:
  workflow_call:
    inputs:
      issue:
        description: Only this issue's test; empty for every issue
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      issue:
        description: Only this issue's test (packages/build-tools/issues/<issue>); empty for every issue
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Linux x64 (${{ inputs.issue && format('issue {0}', inputs.issue) || 'every issue' }})
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'nwutils'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read Node.js and npm versions from devEngines
        run: |
          echo "NODE_VERSION=$(jq -r '.devEngines.runtime.version' package.json)" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update npm to the pinned version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install third party dependencies
        run: npm ci

      - name: Install displays and D-Bus for the tests
        # Tests of file dialogs run NW.js headed (headless NW.js cancels
        # dialogs) on Xvfb, answering the dialogs with a stand-in desktop
        # portal on a private D-Bus bus (dbus-run-session; src/file_chooser_portal.py).
        # Wayland tests run NW.js on a headless weston, through a proxy
        # that records window icons (src/wayland_icon_proxy.py).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus python3-gi weston

      - name: Test against the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          # The system Python, which has PyGObject.
          PYTHON: /usr/bin/python3
        run: |
          xvfb-run --auto-servernum node packages/build-tools/src/cli.js test \
            --dir "$RUNNER_TEMP/nwjs-test" ${ISSUE:+--issue "$ISSUE"}
