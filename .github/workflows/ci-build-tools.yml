name: CI - @nwutils/build-tools

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "packages/build-tools/**"
      - "tests/specs/build-tools/**"
      - ".github/workflows/build-nwjs*.yml"
      - ".github/workflows/test-nwjs.yml"

permissions:
  contents: read

concurrency:
  group: ci-build-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Building NW.js is only wired up for Linux x64 so far.
    runs-on: ubuntu-24.04
    name: Ubuntu 24.04 Intel
    if: github.repository_owner == 'nwutils'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read Node.js and npm versions from devEngines
        run: |
          echo "NODE_VERSION=$(jq -r '.devEngines.runtime.version' package.json)" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update npm to the pinned version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install third party dependencies
        run: npm ci

      - name: Run build-tools test suite
        run: npm run test --workspace=@nwutils/build-tools
