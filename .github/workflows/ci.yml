name: Node.js CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        os:
          - macos-26
          - macos-26-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
        include:
          - os: macos-26
            display: MacOS 26 ARM
          - os: macos-26-intel
            display: MacOS 26 Intel
          - os: ubuntu-24.04
            display: Ubuntu 24.04 Intel
          - os: ubuntu-24.04-arm
            display: Ubuntu 24.04 ARM
          - os: windows-2025
            display: Windows 11 Intel
          - os: windows-11-arm
            display: Windows 11 (ARM)
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.display }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read Node.js and npm versions from devEngines
        id: devengines
        shell: bash
        run: |
          echo "NODE_VERSION=$(jq -r '.devEngines.runtime.version' package.json)" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update npm to the pinned version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install third party dependencies
        run: npm ci

      - name: Check third party vulnerabilities
        run: npm audit

      - name: Check for formatting errors
        run: npm run format

      - name: Check for linting errors
        run: npm run lint

      - name: Check for type errors
        run: npm run type

      - name: Run nw-builder test suite
        run: npm run test:cov --workspace=nw-builder
        env:
          CI: true

      - name: Upload nw-builder coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-nw-builder-${{ matrix.os }}
          path: packages/nw-builder/coverage

      - name: Report nw-builder coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2.12.2
        with:
          name: Vitest Coverage (${{ matrix.os }})
          json-summary-path: packages/nw-builder/coverage/coverage-summary.json

      - name: Run cli test suite with coverage
        id: coverage-cli
        shell: bash
        run: |
          MARKDOWN="$({ npm run test --workspace=@nwutils/cli || true; } | packages/test-coverage/bin/coverage-report.sh cli "${{ matrix.os }}")"
          echo "MARKDOWN<<EOF" >> $GITHUB_OUTPUT
          echo "$MARKDOWN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment cli coverage on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          key: coverage-cli-${{ matrix.os }}
          header: "cli Coverage Report – ${{ matrix.os }}"
          message: ${{ steps.coverage-cli.outputs.MARKDOWN }}

      - name: Run doctor test suite with coverage
        id: coverage-doctor
        shell: bash
        run: |
          MARKDOWN="$({ npm run test --workspace=@nwutils/doctor || true; } | packages/test-coverage/bin/coverage-report.sh doctor "${{ matrix.os }}")"
          echo "MARKDOWN<<EOF" >> $GITHUB_OUTPUT
          echo "$MARKDOWN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment doctor coverage on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          key: coverage-doctor-${{ matrix.os }}
          header: "doctor Coverage Report – ${{ matrix.os }}"
          message: ${{ steps.coverage-doctor.outputs.MARKDOWN }}

      - name: Run getter test suite with coverage
        id: coverage-getter
        shell: bash
        run: |
          MARKDOWN="$({ npm run test --workspace=@nwutils/getter || true; } | packages/test-coverage/bin/coverage-report.sh getter "${{ matrix.os }}")"
          echo "MARKDOWN<<EOF" >> $GITHUB_OUTPUT
          echo "$MARKDOWN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment getter coverage on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          key: coverage-getter-${{ matrix.os }}
          header: "getter Coverage Report – ${{ matrix.os }}"
          message: ${{ steps.coverage-getter.outputs.MARKDOWN }}

      - name: Run runner test suite with coverage
        id: coverage-runner
        shell: bash
        run: |
          MARKDOWN="$({ npm run test --workspace=@nwutils/runner || true; } | packages/test-coverage/bin/coverage-report.sh runner "${{ matrix.os }}")"
          echo "MARKDOWN<<EOF" >> $GITHUB_OUTPUT
          echo "$MARKDOWN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment runner coverage on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          key: coverage-runner-${{ matrix.os }}
          header: "runner Coverage Report – ${{ matrix.os }}"
          message: ${{ steps.coverage-runner.outputs.MARKDOWN }}
