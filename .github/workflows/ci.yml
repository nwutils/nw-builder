name: Node.js CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os:
          - macos-26
          - macos-26-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
        include:
          - os: macos-26
            display: MacOS 26 ARM
          - os: macos-26-intel
            display: MacOS 26 Intel
          - os: ubuntu-24.04
            display: Ubuntu 24.04 Intel
          - os: ubuntu-24.04-arm
            display: Ubuntu 24.04 ARM
          - os: windows-2025
            display: Windows 11 Intel
          - os: windows-11-arm
            display: Windows 11 (ARM)
      fail-fast: false

    name: ${{ matrix.display }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.1.0

      - name: Install third party dependencies
        run: npm ci

      - name: Check for third party vulnerabilities
        run: npm audit

      - name: Check for formatting errors
        run: npm run format

      - name: Check for linting errors
        run: npm run lint

      - name: Check for type errors
        run: npm run type

      - name: Run tests with coverage
        id: coverage
        shell: bash
        run: |
          { npm t || true; } \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | awk '
                /start of coverage report/ {printing=1; next}
                /end of coverage report/   {printing=0}
                printing
              ' > coverage.txt

          echo "COVERAGE<<EOF" >> $GITHUB_OUTPUT
          cat coverage.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Convert coverage to markdown
        id: markdown
        shell: bash
        run: |
          {
            echo "### 📊 Coverage Report — ${{ matrix.os }}"
            echo
            echo "| File | Line % | Branch % | Funcs % | Uncovered Lines |"
            echo "|------|--------|----------|---------|------------------|"
            grep '|' coverage.txt | \
            grep -vE "file\s*\|\s*line|----" | \
            while read -r line; do
              clean=$(echo "$line" | sed 's/^ℹ\s*//' | tr -s ' ')
              echo "| ${clean// | / | } |"
            done
            echo
          } > coverage.md

          echo "MARKDOWN<<EOF" >> $GITHUB_OUTPUT
          cat coverage.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          key: coverage-${{ matrix.os }}
          header: "Coverage Report – ${{ matrix.os }}"
          message: ${{ steps.markdown.outputs.MARKDOWN }}
